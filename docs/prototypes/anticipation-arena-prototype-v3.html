<title>Anticipation Arena Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-sized night match. Scorebug on top, pitch in the middle, coach strip below. Single dark look by choice. */
:root{
  color-scheme: dark;
  --night:#0a1020; --glow:#17234b; --panel:#121a2e; --panel-2:#1a2440; --line:#273357;
  --ink:#eef2fb; --mute:#96a3c0;
  --you:#8f73ff; --you-ink:#ffffff; --away:#ff6a3d; --gold:#ffc83d; --gold-ink:#1b1403; --good:#3ddc97; --bad:#ff5a76;
  --turf:#17804a;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.shell{min-height:100%;display:flex;justify-content:center;padding-inline:16px;background:radial-gradient(120% 55% at 50% -12%,var(--glow) 0%,transparent 62%),var(--night)}
.phone{width:100%;max-width:420px;position:relative}
.screen{display:flex;flex-direction:column;gap:14px;padding-block:14px 22px}

.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggles{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;padding:6px 11px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(40px,12.5vw,54px);line-height:.9;letter-spacing:.005em;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
h1 em{font-style:inherit;color:var(--gold)}
.tag{margin:0;color:var(--mute);font-size:16px}

.read{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.read h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--ink)}
#demo{width:100%;height:150px;display:block;border-radius:10px;background:var(--turf)}
.cues{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.cues li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;font-size:14px;color:var(--mute);min-width:0}
.cues b{color:var(--ink);font-weight:600}
.num{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;line-height:1}

.sec{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 -4px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;display:grid;justify-items:center;gap:3px;padding:9px 4px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.tile .n{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1}
.tile .st{display:flex;gap:2px}
.tile .st svg{width:11px;height:11px;fill:var(--line)}
.tile .st svg.on{fill:var(--gold)}
.tile .tg{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.tile.pro .tg{color:var(--gold)}
.tile[aria-pressed="true"]{border-color:var(--you);background:var(--panel-2);box-shadow:0 0 0 1px var(--you) inset}
.ladder{display:grid;gap:10px}
.stage-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.stage-row:last-child{border-bottom:0;padding-bottom:0}
.stage-row .eyebrow{font-size:12px}
.stage-row .eyebrow b{color:var(--gold);font-weight:700}
.stage-row .sn{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase;margin:2px 0 0}
.stage-row .tiles{display:flex;gap:8px}
.ladder .tile{width:52px;padding:8px 3px}
.ladder .tile .n{font-size:26px}

.detail{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.detail .name{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;margin:0}
.detail p{margin:0;color:var(--mute)}
.detail p b{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.facts div{min-width:0}
.facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px}
.facts dt{font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.facts dd{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 18px;border-radius:14px;font-family:var(--display);font-style:italic;font-weight:800;font-size:23px;letter-spacing:.04em;text-transform:uppercase}
.btn.primary{background:var(--you);color:var(--you-ink);box-shadow:0 10px 24px -10px var(--you)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{border:1px solid var(--line);background:var(--panel)}
.btn svg{width:18px;height:18px;fill:currentColor}
.note{margin:0;font-size:12.5px;color:var(--mute);text-align:center}

/* game */
#game{gap:10px;user-select:none;-webkit-user-select:none}
.bug{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px}
.bug-title{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:6px;margin-top:5px}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.pip.cur{border-color:var(--ink)}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.no{background:var(--bad);border-color:var(--bad)}
.bug-score{text-align:right}
.bug-score .lbl{display:block;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.bug-score #score{font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--turf);box-shadow:0 0 0 1px var(--line),0 24px 50px -30px #000}
#pitch{display:block;width:100%;touch-action:manipulation}
.timer{position:absolute;inset:0 0 auto 0;height:6px;background:rgba(6,10,22,.55)}
.timer i{display:block;height:100%;width:100%;transform-origin:0 50%;background:var(--gold)}
.timer.low i{background:var(--bad)}
.coach{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:center;min-height:58px;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.coach .dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.coach.ask .dot{background:var(--gold)}.coach.good .dot{background:var(--good)}.coach.bad .dot{background:var(--bad)}
.coach p{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.12;letter-spacing:.01em}
.coach.good p{color:var(--good)}.coach.bad p{color:var(--bad)}

/* results */
#results{align-items:stretch;text-align:center;gap:16px;padding-block:34px 24px}
#results h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:46px;line-height:.92;text-transform:uppercase;margin:0;text-wrap:balance}
.stars{display:flex;justify-content:center;gap:10px}
.stars svg{width:62px;height:62px;fill:var(--panel-2);stroke:var(--line);stroke-width:1}
.stars svg.on{fill:var(--gold);stroke:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stars svg:nth-child(2){transform:translateY(-8px)}
@keyframes pop{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
.res-pips{display:flex;justify-content:center;gap:7px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0;padding:14px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.stats dt{font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.stats dd{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.coachline{margin:0;color:var(--mute);font-size:15px;text-wrap:balance}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.one{grid-template-columns:1fr}
.actions .btn{font-size:20px;white-space:nowrap;padding:0 10px}
.link{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--mute);padding:8px;align-self:center}
@media (prefers-reduced-motion:reduce){.stars svg.on{animation:none}}
</style>

<section id="menu" class="screen">

        <svg id="snd-off" viewBox="0 0 24 24" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
    </div>

  <h1>Anticipation <em>Arena</em></h1>

  <div class="read">

  </div>

  <h2 class="sec" data-t="levels"></h2>
  <div class="ladder" id="grid"></div>
  <div class="detail">
    <p class="eyebrow" id="d-eyebrow"></p>
    <p class="name" id="d-name"></p>

    <p id="d-tip"></p>

    <dl class="facts">
      <div><dt data-t="fRecv"></dt><dd id="f-recv"></dd></div>

      <div><dt data-t="fTrail"></dt><dd id="f-trail"></dd></div>
    </dl>
  </div>
  <button class="btn primary" id="play" type="button"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><span id="play-label"></span></button>
  <p class="note" data-t="proto"></p>
</section>

<section id="game" class="screen" hidden>
  <header class="bug" id="bug">
    <button id="quit" class="icon-btn" type="button" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div><div class="bug-title" id="bug-title"></div><div class="pips" id="pips"></div></div>
    <div class="bug-score"><span class="lbl" data-t="score"></span><span id="score">0</span></div>
  </header>
  <div class="stage" id="stage"><canvas id="pitch"></canvas><div class="timer" id="timer" hidden><i></i></div></div>
  <div class="coach" id="coach"><span class="dot"></span><p id="coach-text" aria-live="polite"></p></div>
</section>

<section id="results" class="screen" hidden>
  <p class="eyebrow" id="res-eyebrow"></p>
  <h2 id="res-title"></h2>
  <div class="stars" id="res-stars"></div>
  <div class="res-pips" id="res-pips"></div>
  <dl class="stats">
    <div><dt data-t="reads"></dt><dd id="res-reads"></dd></div>
    <div><dt data-t="score"></dt><dd id="res-score"></dd></div>
    <div><dt data-t="avg"></dt><dd id="res-avg"></dd></div>
    <div><dt>XP</dt><dd id="res-xp"></dd></div>
  </dl>
  <p class="coachline" id="res-coach"></p>
  <div class="actions" id="res-actions">
    <button id="retry" class="btn ghost" type="button"></button>
    <button id="next" class="btn primary" type="button"></button>
  </div>
  <button id="tolevels" class="link" type="button"></button>
</section>

</main></div>

function frame(now) {

const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.4l2.95 6.1 6.65.9-4.85 4.65 1.2 6.6L12 17.5l-5.95 3.15 1.2-6.6L2.4 9.4l6.65-.9z"/></svg>';

/* ---------- menu ---------- */
function show(id) { for (const s of ['menu', 'game', 'results']) $('#' + s).hidden = s !== id; window.scrollTo(0, 0); if (id === 'menu') { paintMenu(); startDemo(); } else stopDemo(); }

$('#lang-en').addEventListener('click', () => setLang('en')); $('#lang-es').addEventListener('click', () => setLang('es'));

let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#game').hidden) { const keep = G.phase; resize(); if (keep !== 'idle') nextRead(); } sizeDemo(); }, 180); });
